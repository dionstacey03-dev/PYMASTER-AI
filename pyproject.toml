[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pymaster-ai"
version = "0.1.0"
description = "A starting point for PYMASTER-AI"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
pymaster-ai = "pymaster_ai.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pymaster_ai = ["static/*.html"]
