name: Python and frontend checks

on:
  push:
    branches: [main, "audit/**", "chore/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pymaster-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python, JavaScript and deployment checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install package in editable mode
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Compile Python sources
        run: python -m compileall -q src tests api scripts

      - name: Run Python tests
        run: python -m unittest discover -s tests -v

      - name: Run JavaScript core tests
        run: node --test tests/js/learning-core.test.cjs

      - name: Check JavaScript syntax
        run: |
          node --check src/pymaster_ai/static/app.js
          node --check src/pymaster_ai/static/languages.js
          node --check src/pymaster_ai/static/learning-core.js
          node --check src/pymaster_ai/static/learning-ui.js
          node --check src/pymaster_ai/static/playground-frame.js
          node --check src/pymaster_ai/static/workspace.js

      - name: Verify deployment export
        run: python scripts/export_site.py

      - name: Validate Vercel configuration
        run: python -c "import json; json.load(open('vercel.json', encoding='utf-8'))"

      - name: Build distributable wheel
        run: |
          python -m pip install build
          python -m build --wheel
          python -c "from zipfile import ZipFile; import glob; z=ZipFile(glob.glob('dist/*.whl')[0]); names=z.namelist(); assert any(n.endswith('/static/index.html') for n in names); assert any(n.endswith('/static/app.js') for n in names); print('Wheel contains the main HTML and JavaScript assets.')"

      - name: Check patch whitespace
        run: git diff --check
